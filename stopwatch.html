<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المؤقت التنازلي الأنيق</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #f1f5f9;
        }

        .container {
            background-color: #1e293b; 
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 400px;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
        }

        .number-font {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="number"] {
            width: 70%;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            background-color: #0f172a;
            color: #38bdf8; 
            border: 2px solid #334155;
            border-radius: 10px;
            margin-bottom: 25px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #38bdf8;
        }

        input[type="number"]::placeholder {
            color: #64748b;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: normal;
        }

        .quick-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        .quick-pad button {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 12px 0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .quick-pad button:hover:not(:disabled) {
            background-color: #475569;
        }

        .quick-pad button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .quick-pad button:disabled {
            background-color: #1e293b;
            color: #475569;
            border: 1px solid #334155;
            cursor: not-allowed;
        }

        #display {
            font-size: 80px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        #display.warning {
            color: #ef4444; 
            transform: scale(1.05); 
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .control-btn {
            flex: 1;
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        #startBtn { 
            background-color: #10b981; 
        }
        #startBtn:hover:not(:disabled) { 
            background-color: #059669; 
        }
        
        #pauseBtn { 
            background-color: #f59e0b; 
        }
        #pauseBtn:hover:not(:disabled) { 
            background-color: #d97706; 
        }
        
        #resetBtn { 
            background-color: #ef4444; 
        }
        #resetBtn:hover:not(:disabled) { 
            background-color: #dc2626; 
        }
        
        .control-btn:disabled {
            background-color: #334155 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>أدخل الوقت (بالدقائق)</h2>
        
        <input type="number" id="timeInput" class="number-font" min="0.1" step="any" placeholder="المدة..">
        
        <div class="quick-pad" id="quickPad">
            <button class="number-font" onclick="setQuickTime(1)">1</button>
            <button class="number-font" onclick="setQuickTime(2)">2</button>
            <button class="number-font" onclick="setQuickTime(3)">3</button>
            <button class="number-font" onclick="setQuickTime(4)">4</button>
            <button class="number-font" onclick="setQuickTime(5)">5</button>
            <button class="number-font" onclick="setQuickTime(6)">6</button>
            <button class="number-font" onclick="setQuickTime(7)">7</button>
            <button class="number-font" onclick="setQuickTime(8)">8</button>
            <button class="number-font" onclick="setQuickTime(9)">9</button>
            <button class="number-font" onclick="setQuickTime(10)">10</button>
        </div>

        <div id="display" class="number-font">00:00</div>
        
        <div class="btn-group">
            <button class="control-btn" id="startBtn" onclick="startTimer()">بدء</button>
            <button class="control-btn" id="pauseBtn" onclick="togglePause()" disabled>إيقاف مؤقت</button>
            <button class="control-btn" id="resetBtn" onclick="resetTimer()" disabled>إنهاء</button>
        </div>
    </div>

    <script>
        let timeLeft = 0;
        let timerInterval = null;
        let isPaused = false;
        let expectedEndTime = 0;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

        function playEndSound() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 1.5);
        }

        function updateDisplay(seconds) {
            const display = document.getElementById("display");
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            display.textContent = 
                String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
        }

        function setQuickTime(minutes) {
            const input = document.getElementById("timeInput");
            input.value = minutes;
            timeLeft = 0;
            updateDisplay(minutes * 60);
        }

        function toggleQuickPad(disabled) {
            const padBtns = document.querySelectorAll("#quickPad button");
            padBtns.forEach(btn => btn.disabled = disabled);
        }

        function startTimer() {
            const input = document.getElementById("timeInput");
            const startBtn = document.getElementById("startBtn");
            const pauseBtn = document.getElementById("pauseBtn");
            const resetBtn = document.getElementById("resetBtn");
            const display = document.getElementById("display");
            
            if (timerInterval) return;

            if (timeLeft === 0) {
                const inputMins = parseFloat(input.value);
                if (isNaN(inputMins) || inputMins <= 0) {
                    alert("الرجاء إدخال رقم صحيح أو عشري موجب للدقائق.");
                    return;
                }
                timeLeft = Math.floor(inputMins * 60); 
            }

            initAudio();

            input.disabled = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            toggleQuickPad(true); 
            isPaused = false;
            pauseBtn.textContent = "إيقاف مؤقت";
            display.classList.remove("warning");

            expectedEndTime = Date.now() + (timeLeft * 1000);
            updateDisplay(timeLeft);

            timerInterval = setInterval(() => {
                if (isPaused) {
                    expectedEndTime += 1000;
                    return;
                }

                const currentTime = Date.now();
                timeLeft = Math.max(0, Math.round((expectedEndTime - currentTime) / 1000));
                
                updateDisplay(timeLeft);

                if (timeLeft <= 30 && timeLeft > 0) {
                    display.classList.add("warning");
                    playTickSound();
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    playEndSound();
                    
                    input.disabled = false;
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    resetBtn.disabled = true;
                    toggleQuickPad(false);
                    display.classList.remove("warning");
                    
                    setTimeout(() => {
                        alert("انتهى الوقت!");
                        // إعادة عرض القيمة الأصلية بعد إغلاق التنبيه
                        const inputMins = parseFloat(input.value);
                        if (!isNaN(inputMins) && inputMins > 0) {
                            updateDisplay(Math.floor(inputMins * 60));
                            timeLeft = 0; 
                        }
                    }, 100);
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById("pauseBtn");
            pauseBtn.textContent = isPaused ? "متابعة" : "إيقاف مؤقت";
            
            if (!isPaused) {
                initAudio();
                expectedEndTime = Date.now() + (timeLeft * 1000);
            }
        }

        function resetTimer() {
            const input = document.getElementById("timeInput");
            const startBtn = document.getElementById("startBtn");
            const pauseBtn = document.getElementById("pauseBtn");
            const resetBtn = document.getElementById("resetBtn");
            const display = document.getElementById("display");

            clearInterval(timerInterval);
            timerInterval = null;
            isPaused = false;
            timeLeft = 0; 

            input.disabled = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
            toggleQuickPad(false);
            pauseBtn.textContent = "إيقاف مؤقت";
            display.classList.remove("warning");
            
            const inputMins = parseFloat(input.value);
            if (!isNaN(inputMins) && inputMins > 0) {
                updateDisplay(Math.floor(inputMins * 60));
            } else {
                display.textContent = "00:00";
            }
        }

        document.getElementById("timeInput").addEventListener('input', function(e) {
            if (timeLeft === 0 && !timerInterval) {
                const val = parseFloat(e.target.value);
                if (!isNaN(val) && val > 0) {
                    updateDisplay(Math.floor(val * 60));
                } else {
                    document.getElementById("display").textContent = "00:00";
                }
            }
        });
    </script>
</body>
</html>
